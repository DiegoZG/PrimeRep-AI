# Sub-flow: Ensure the user is logged in to the native PrimeRep development build.
# Required env vars: LOGIN_EMAIL and LOGIN_PASSWORD.

appId: com.diegozegarra.primerep
---
- runFlow:
    when:
      notVisible: "This Week"
    commands:
      - tapOn:
          id: "onboarding-login-link"
          optional: true
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 8000
      - tapOn:
          id: "email-input"
      - eraseText: 50
      - inputText: ${LOGIN_EMAIL}
      - tapOn:
          id: "password-input"
      - eraseText: 50
      - inputText: ${LOGIN_PASSWORD}
      - tapOn:
          id: "login-button"
      - tapOn:
          text: "Not Now"
          optional: true
      - extendedWaitUntil:
          visible: "This Week"
          timeout: 15000
