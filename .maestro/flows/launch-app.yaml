# Sub-flow: Launch PrimeRep-AI inside Expo Go and wait for auth to resolve.
#
# Expo Go opens its own launcher screen first. "Recently opened" entries
# cache the dev-server host/IP from when they were first added, so if the
# Mac's LAN IP has changed since (network switch, VPN), tapping the cached
# entry hangs on "Opening project..." even though Metro itself is healthy.
# Force-opening via the loopback exp:// URL sidesteps that entirely.

appId: host.exp.Exponent
---
- launchApp

# Prevent XCTest cold-boot crash (iOS)
- swipe:
    direction: DOWN
    duration: 100

- openLink: "exp://127.0.0.1:8081"

# Wait for auth bootstrapping to complete
- extendedWaitUntil:
    visible:
      id: "auth-loaded"
    timeout: 20000
