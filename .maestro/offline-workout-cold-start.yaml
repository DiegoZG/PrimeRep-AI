# Native release/development build only. Before running, sign in online,
# start a workout, confirm set 1 of an exercise with at least two sets, then
# disconnect the simulator.
# Keep the backend unreachable through this flow. Reconnect afterward and
# verify exactly one canonical server session with every saved mutation.
appId: com.diegozegarra.primerep
---
- stopApp
- launchApp
- swipe:
    direction: DOWN
    duration: 100
- extendedWaitUntil:
    visible:
      id: player-finish
    timeout: 30000
- tapOn:
    id: player-finish
- tapOn: "Finish anyway"
- extendedWaitUntil:
    visible: "Saved on this device — finish when online."
    timeout: 45000
- takeScreenshot: offline-finish-queued
- stopApp
- launchApp
- swipe:
    direction: DOWN
    duration: 100
- extendedWaitUntil:
    visible:
      id: player-finish
    timeout: 30000
- assertVisible: "Saved on this device — finish when online."
- takeScreenshot: offline-finish-after-cold-start
- tapOn:
    id: player-continue-logging
- extendedWaitUntil:
    visible: "Finish Workout.*"
    timeout: 45000
- assertNotVisible: "Saved on this device — finish when online."
- takeScreenshot: offline-continue-logging
- scrollUntilVisible:
    element:
      id: "player-reps-input-.*-2"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "player-reps-input-.*-2"
- eraseText: 5
- inputText: "9"
- tapOn:
    id: "player-weight-input-.*-2"
- eraseText: 5
- inputText: "35"
- tapOn:
    id: "player-confirm-set-.*-2"
- extendedWaitUntil:
    visible:
      id: player-rest-skip
    timeout: 5000
- tapOn:
    id: player-rest-skip
- takeScreenshot: offline-extra-set-queued
- tapOn:
    id: player-finish
- tapOn: "Finish anyway"
- extendedWaitUntil:
    visible: "Saved on this device — finish when online."
    timeout: 45000
- takeScreenshot: offline-finish-requeued
