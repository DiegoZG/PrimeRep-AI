# Requires a running backend. The deliberately invalid token must produce the
# same unavailable state as an expired or consumed reset link.

appId: com.diegozegarra.primerep
---
- openLink: "primerepai://reset-password?token=maestro-invalid-token"
- extendedWaitUntil:
    visible:
      id: "password-reset-confirm-submit"
    timeout: 10000
- tapOn:
    id: "password-reset-new-password"
- inputText: "StrongPass456"
- tapOn:
    id: "password-reset-confirm-password"
- inputText: "StrongPass456"
- tapOn:
    id: "password-reset-confirm-submit"
- extendedWaitUntil:
    visible:
      id: "password-reset-invalid"
    timeout: 10000
- assertVisible: "This reset link is invalid, expired, or already used."
