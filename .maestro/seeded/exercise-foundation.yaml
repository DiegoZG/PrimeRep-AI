# Requires an isolated fixture catalog with 250 visible "Foundation Fixture"
# exercises, ordered 001–250. Fixture 201 has an approved playable video.
# Override account/query/name values for another disposable fixture.
appId: host.exp.Exponent
env:
  LOGIN_EMAIL: exercise-foundation@example.com
  LOGIN_PASSWORD: StrongPass123
  SEARCH_QUERY: Foundation Fixture
  LAST_PAGE_EXERCISE: Foundation Fixture 201
---
- runFlow: ../flows/launch-app.yaml
- runFlow: ../flows/auth-login.yaml
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible:
      id: browse-programs
    timeout: 15000
- tapOn: "Search programs and exercises…"
- inputText: ${SEARCH_QUERY}
- hideKeyboard
- tapOn:
    id: explore-search-scope-exercises
- repeat:
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            id: explore-exercises-load-more
          direction: DOWN
          timeout: 30000
      - extendedWaitUntil:
          visible:
            id: explore-exercises-load-more
            enabled: true
          timeout: 15000
      - tapOn:
          id: explore-exercises-load-more
      - extendedWaitUntil:
          visible:
            id: explore-exercises-load-more
            enabled: true
          timeout: 15000
- scrollUntilVisible:
    element:
      id: explore-exercises-load-more
    direction: DOWN
    timeout: 30000
- tapOn:
    id: explore-exercises-load-more
- extendedWaitUntil:
    notVisible:
      id: explore-exercises-load-more
    timeout: 15000
- scrollUntilVisible:
    element: ${LAST_PAGE_EXERCISE}
    direction: DOWN
    timeout: 30000
- tapOn: ${LAST_PAGE_EXERCISE}
- extendedWaitUntil:
    visible:
      id: exercise-watch-demo
    timeout: 15000
- tapOn:
    id: exercise-watch-demo
- extendedWaitUntil:
    visible:
      id: exercise-video-player
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: exercise-video-loading
    timeout: 25000
- assertNotVisible:
    id: exercise-video-error
- takeScreenshot: exercise-foundation-inline-player
- tapOn: "Back from exercise"
