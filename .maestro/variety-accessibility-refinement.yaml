appId: com.diegozegarra.primerep
---
- extendedWaitUntil:
    visible:
      id: auth-loaded
    timeout: 15000
- extendedWaitUntil:
    notVisible: Downloading.*
    timeout: 15000
- extendedWaitUntil:
    visible: Variety Level.*
    timeout: 15000
- runFlow:
    when:
      true: ${MODE === "selection"}
    commands:
      - assertVisible:
          id: ${OPTION_ID}
      - tapOn:
          id: ${OPTION_ID}
      - assertVisible:
          text: NEXT
          enabled: true
- takeScreenshot: ${SCREENSHOT_PREFIX}
