# E2E Test: Workout Player (Phase 1)
#
# Tests: Home → workout detail → Start Workout → guided one-exercise player →
#        confirm a prefilled set → skip rest → jump to another exercise via
#        the exercise list sheet → finish workout → summary screen.
#
# Prerequisites:
#   - Simulator/emulator with app installed
#   - Backend running with at least one workout in the current week
#   - TEST account must have completed onboarding (equipment + split set)
#
# Run:
#   maestro test .maestro/workout-player.yaml

appId: host.exp.Exponent
env:
  LOGIN_EMAIL: testuser@primerep.com
  LOGIN_PASSWORD: StrongPass123
---
# =============================================
# STEP 1: LAUNCH + AUTH PRE-FLIGHT
# =============================================

- runFlow: flows/launch-app.yaml
- runFlow: flows/auth-login.yaml

# =============================================
# STEP 2: HOME → WORKOUT DETAIL → START WORKOUT
# =============================================

- assertVisible: "This Week"

- extendedWaitUntil:
    notVisible: "Loading your week..."
    timeout: 10000

- tapOn:
    id: "workout-card"
    index: 0

- extendedWaitUntil:
    visible: "Main Lifts"
    timeout: 8000

- tapOn:
    id: "start-workout-button"

# =============================================
# STEP 3: PLAYER LOADS — ONE EXERCISE AT A TIME
# =============================================

# "Starting session..." resolves once the session is created; the Finish
# button is present as soon as the first exercise renders.
- extendedWaitUntil:
    visible:
      id: "player-finish"
    timeout: 15000

- takeScreenshot: 01-player-first-exercise

# =============================================
# STEP 4: CONFIRM A SET (PREFILLED OR MANUAL)
# =============================================

# Ensure reps/weight have values — if the test account has no history for
# this exercise the fields are blank, so fill them in defensively.
- tapOn:
    id: "player-reps-input"
    index: 0
- eraseText: 5
- inputText: "10"

- tapOn:
    id: "player-weight-input"
    index: 0
- eraseText: 5
- inputText: "40"

- tapOn:
    id: "player-confirm-set"
    index: 0

# =============================================
# STEP 5: REST TIMER → SKIP
# =============================================

- extendedWaitUntil:
    visible:
      id: "player-rest-skip"
    timeout: 5000

- takeScreenshot: 02-rest-timer

- tapOn:
    id: "player-rest-skip"

# If that was the exercise's last set, a brief "Next up" transition shows —
# tap Continue if present, otherwise carry on (more sets remain).
- tapOn:
    id: "player-next-exercise"
    optional: true

# =============================================
# STEP 6: JUMP TO ANOTHER EXERCISE VIA THE SHEET
# =============================================

- tapOn:
    id: "player-exercise-list-button"

- extendedWaitUntil:
    visible: "Exercises"
    timeout: 5000

- takeScreenshot: 03-exercise-sheet

- tapOn:
    id: "player-sheet-exercise-row"
    index: 1

# =============================================
# STEP 7: FINISH WORKOUT
# =============================================

- tapOn:
    id: "player-finish"

- extendedWaitUntil:
    visible: "Finish Workout?"
    timeout: 5000

- tapOn: "Finish"

# =============================================
# STEP 8: VERIFY SUMMARY SCREEN
# =============================================

- extendedWaitUntil:
    visible: "Workout Complete!"
    timeout: 10000

- takeScreenshot: 04-workout-summary

- tapOn:
    id: "summary-done"
