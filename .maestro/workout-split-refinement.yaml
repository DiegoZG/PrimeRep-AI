- runFlow:
    when:
      true: ${MODE == 'light' || MODE == 'dark' || MODE == 'restore'}
    commands:
      - scrollUntilVisible:
          element:
            id: workout-split-option-ai-optimized
          direction: UP
          centerElement: true
          visibilityPercentage: 100
          timeout: 30000
