- extendedWaitUntil:
    visible:
      id: auth-loaded
    timeout: 60000
- openLink: primerepai://onboarding/workout-split
- extendedWaitUntil:
    visible:
      id: workout-split-scroll
    timeout: 15000
- assertNotVisible: There was a problem loading the project.
- assertNotVisible:
